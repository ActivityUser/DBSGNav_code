# @package _global_
# 防数据泄露：建图、实例库(instance_retrieval/instance_clip_vectors)、语义高斯(params.npz) 应在训练集上做。
# 若改用训练集，请：(1) 准备训练集场景数据目录 habitat_train（结构同 habitat）；(2) 在 habitat_train 上跑
#   seg → transform_pointcloud → build_instance_clip_vectors 及 GaussianConstruction 建图；(3) 将下方
#   habitat.dataset.split / end2end_imagenav.split 改为 train，gaussian_map_root 改为
#   ../GaussianConstruction/experiments/habitat_train，base_scene_path 改为 ../GaussianConstruction/configs/data/habitat_train，
#   并用 --config 指定本文件或复制为 instance_imagenav_train.yaml 后使用。

defaults:


  - /habitat: habitat_config_base
  - /habitat/task: instance_imagenav
  - /habitat/simulator/agents@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/dataset/instance_imagenav: hm3d_v3
  - _self_



habitat:

  environment:
    max_episode_seconds: 1000
  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 480
            height: 640
            hfov: 42
            position: [0, 0.88, 0]
          depth_sensor:
            width: 480
            height: 640
            hfov: 42
            min_depth: 0.01
            max_depth: 15.0
            position: [0, 0.88, 0]
          # semantic_sensor:
          #   width: 480
          #   height: 640
          #   hfov: 42
          #   position: [0, 0.88, 0]
        height: 0.88
        radius: 0.17
    habitat_sim_v0:
      gpu_device_id: 0
      allow_sliding: True
  dataset:
    split: train
    content_scenes: ["*"]  # HM3D val 全量：加载 val 下所有 content/*.json.gz；若只跑单场景可改为 ["CrMo8WxCyVb"]

end2end_imagenav:
  env_name: instance_imagenav 
  dump_location: "examples/"
  max_episodes: 1000
  num_envs: 1
  num_gpus: 1
  num_nodes: 1
  split: train
  # target_scenes: ["*"]  # 关闭运行时过滤，使用 habitat.dataset.content_scenes
  node_id: 0
  gpu_id: 0
  checkpoint_folder: data/new_checkpoints
  log_interval: 10
  num_checkpoints: 100
  # Force PyTorch to be single threaded as
  # this improves performance considerably
  force_torch_single_threaded: True

  viz_params:
    viz: False
    viz_failure_case: True

  particle_params:
    method: 1 # 0 means hist, 1 means DISK + LightGlue
    remap_goal: True # True means remap the goal to the same cat

  # 创新点 1+2: 语义高斯目标（从建图 params.npz 的 clip_vectors 匹配目标图）
  use_semantic_gaussian_goal: True  # 需先跑 GaussianConstruction 并生成带 CLIP 的 params.npz
  # 建图输出根目录，其下每子目录为 scene（如 CrMo8WxCyVb_seed4_clip），含 params.npz。可用相对路径（相对 GaussianNavigation 目录）
  gaussian_map_root: "../GaussianConstruction/experiments/habitat_train"
  semantic_gaussian_top_k: 3  # 取 CLIP 相似度 top-k 高斯的中心作为目标
  semantic_gaussian_min_sim: 0.08  # 低于该阈值则拒绝语义高斯目标
  semantic_gaussian_high_conf_sim: 0.10  # SG+OV 同时可用时，SG 仅在高置信(>=该阈值)时优先
  prefer_open_vocab_when_semantic_gaussian_low_conf: True  # SG 低置信时优先用 OV(含几何验证)
  semantic_gaussian_enable_fallback_open_vocab: True  # 语义高斯被拒绝后回退到 open_vocab

  # 创新点 3: Open-vocab instance retrieval (CLIP + geometric verification)
  use_open_vocab_retrieval: True
  # 是否允许回退到 GT 目标：True=语义高斯/open_vocab 失败时用 GT（仅诊断/上界）；
  # False=非GT 模式，不使用 GT。失败样本的处理由 non_gt_fallback_handling 控制。
  allow_gt_fallback: True
  # 非GT模式下 GT fallback 的处理：
  # - count_as_failure: 不跳过，直接按失败计入（推荐，避免样本偏差）
  # - skip_episode: 跳过该 episode（旧行为，可能导致样本偏差）
  non_gt_fallback_handling: "count_as_failure"
  # 每回合打印 [episode_goal_summary]，供 scripts/summarize_episode_goal_log.py 做 goal_source 归因；长训练可改 False
  log_episode_goal_summary: True
  # run.py --log_file 时由 run.py 注入：子进程把摘要追加到此路径（多进程时 print 不进主进程 tee 文件，见 run.py 说明）
  episode_goal_summary_append_path: ""
  open_vocab_top_k: 5
  open_vocab_semantic_weight: 0.8  # alpha: 语义项权重（与 open_vocab_fusion_use_semantic_score 联用）
  # 创新点 4: 语义-几何融合匹配策略（加权融合）
  fusion_geometric_weight: 0.2     # beta；若未设则用 1 - open_vocab_semantic_weight
  fusion_normalize_geometric: "minmax"  # 几何分归一化: minmax | max | none
  # 是否把语义/几何相似度计入融合分（false 时该项为 0，不再用 α=0 或 β=0 表示「关闭一路」）；关几何时跳过 DISK+LightGlue 以省算力
  open_vocab_fusion_use_semantic_score: true
  open_vocab_fusion_use_geometric_score: true
  # fusion_adaptive_weights: False  # 可选：根据场景/纹理自适应 α,β（需语义与几何两路均开启融合时生效）
  # 场景数据根目录：其下每个子目录为一场景，需含 instance_retrieval.json 和 rgb/frame_*.png。可用相对路径
  base_scene_path: "../GaussianConstruction/configs/data/habitat_train"
  clip_model_name: "ViT-B-32"
  clip_dim: 512
  # 动态语义图更新门控（mapper.step）：0=关闭距离门控
  dynamic_semantic_update_max_goal_dist: 0.0
  dynamic_semantic_update_disable_when_ov_geo_floor_weak: false
  # 动态语义 planner（FMM 扩目标）门控：可与 mapper 更新独立配置
  dynamic_semantic_planner_max_goal_dist: 0.0   # >0 时仅 distance_to_goal<=该值(米)时启用语义扩目标
  dynamic_semantic_planner_disable_when_ov_geo_floor_weak: false  # true 时若 OV 几何证据弱则不扩目标

  # 创新点 5: 开放词汇评估基准（零样本测试集：COCO 类别外物体）
  use_open_vocab_benchmark: False  # True 时仅评估 object_category 不在标准 IIN 6 类中的 episode
  # open_vocab_data_path: ""  # 可选：预生成的零样本数据集 .json.gz（可用 python -m datasets.open_vocab_iin build 生成）


  mapper:
    frame_height: 320
    frame_width: 240
    map_resolution: 5
    map_size_cm: 3600
    global_downscaling: 3
    # 创新点 6: 动态语义更新（增量式 CLIP 语义图）
    enable_dynamic_semantic_update: False  # True 时每步用当前帧 CLIP 更新 mapper 内语义图
    dynamic_semantic_blend_alpha: 0.3     # 新观测权重 (1-alpha)*旧 + alpha*新（基准值）
    # 动态 alpha：false | "count"(按更新次数) | "consistency"(按当前观测与地图一致性，更直观)
    dynamic_semantic_adaptive_alpha: "consistency"
    dynamic_semantic_alpha_min: 0.05      # 动态 alpha 下限
    dynamic_semantic_alpha_decay: 0.5     # 仅 count 时用：alpha = base/(1 + k*count)
    # 写入语义图前将每格 CLIP 向量 L2 单位化（默认 false；full 消融 yaml 可开）
    dynamic_semantic_renormalize_cells: False
    # 创新点 6 接入规划：用在线语义图与目标图的相似度，在锚点邻域内扩展 FMM 目标格（需 enable_dynamic_semantic_update=True）
    dynamic_semantic_planner: True
    dynamic_semantic_planner_thr: 0.18
    dynamic_semantic_planner_radius: 22
    dynamic_semantic_planner_min_timestep: 8
    # 仅在阈值区内取若干相关峰值并入目标（减轻大片假阳性）；false=保留原有整块并入
    dynamic_semantic_planner_peaks_only: false
    dynamic_semantic_planner_max_peaks: 12
    dynamic_semantic_planner_peak_min_sep: 3   # 峰值间曼哈顿间隔下限（>=1）

