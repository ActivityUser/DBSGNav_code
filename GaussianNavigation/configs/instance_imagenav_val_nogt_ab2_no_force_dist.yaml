# @package _global_
# 实验 4：HM3D val 验证集 + 非GT 模式 — 测 succ/spl/dist 等（真实方法评估）
# 消融2：关闭 semantic_gaussian_ov_disagree_force_dist（其余同主配置）
# 前置：全量 val 需完整 HM3D mesh + 各场景的 configs/data/habitat_val 与 experiments/habitat_val_final；缺资源场景会失败或 fallback
defaults:
  - /habitat: habitat_config_base
  - /habitat/task: instance_imagenav
  - /habitat/simulator/agents@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/dataset/instance_imagenav: hm3d_v3
  - _self_

habitat:
  environment:
    max_episode_seconds: 1000
  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 480
            height: 640
            hfov: 42
            position: [0, 0.88, 0]
          depth_sensor:
            width: 480
            height: 640
            hfov: 42
            min_depth: 0.01
            max_depth: 15.0
            position: [0, 0.88, 0]
        height: 0.88
        radius: 0.17
    habitat_sim_v0:
      gpu_device_id: 0
      allow_sliding: True
  dataset:
    split: val
    content_scenes: ["*"]

end2end_imagenav:
  env_name: instance_imagenav
  dump_location: "examples/"
  max_episodes: 1000
  num_envs: 1
  num_gpus: 1
  num_nodes: 1
  split: val
  node_id: 0
  gpu_id: 0
  checkpoint_folder: data/new_checkpoints
  log_interval: 10
  num_checkpoints: 100
  force_torch_single_threaded: True
  viz_params:
    viz: False
    viz_failure_case: True
  particle_params:
    method: 1
    remap_goal: True
  use_semantic_gaussian_goal: True
  # SplaTAM：<gaussian_map_root>/<scene_id>_seed4_clip/params.npz（本机也可用绝对路径指向同目录）
  gaussian_map_root: "../GaussianConstruction/experiments/habitat_val_final"
  semantic_gaussian_top_k: 1
  # 低于此相似度则不采纳 SG 候选（提高阈值可减少 SG 偏移误导）
  semantic_gaussian_min_sim: 0.3
  # 与 OV 并存时：仅当 sg_sim >= 此值才坚持用 SG；代码分支为 sg_sim < 本值 → open_vocab_refine
  # 故阈值应足够高（如 0.96），否则 sim≈0.91 仍会锁 SG 而丢掉 dist 更小的 OV
  semantic_gaussian_high_conf_sim: 0.995
  # SG 与 OV 候选差异过大时，默认走 OV（除非 SG 置信度极高）
  semantic_gaussian_ov_disagree_dist: 3.0
  semantic_gaussian_ov_disagree_high_conf: 0.997
  # SG/OV 相距 ≥ 该值(米)时强制采用 OV，避免「sg_sim 极高仍选错 SG」绕过 disagree 门控
  semantic_gaussian_ov_disagree_force_dist: 0.0
  # SG 候选离当前 agent 过远时拒绝（防止大偏移点）
  semantic_gaussian_max_agent_goal_dist: 10.0
  # OV 离 agent 过远时仅打日志（见 env 实现）
  open_vocab_max_agent_goal_dist: 8.0
  # 融合后对更远的 OV 候选减分，削弱 CLIP 长尾误检（0 关闭）
  open_vocab_agent_dist_penalty: 0.025
  # 按候选几何质量自适应调整 α/β
  fusion_adaptive_weights: True
  prefer_open_vocab_when_semantic_gaussian_low_conf: True
  semantic_gaussian_enable_fallback_open_vocab: True
  use_open_vocab_retrieval: True
  allow_gt_fallback: False   # 非GT 模式
  non_gt_fallback_handling: "count_as_failure"
  open_vocab_top_k: 5
  open_vocab_semantic_weight: 0.8
  fusion_geometric_weight: 0.2
  fusion_normalize_geometric: "minmax"
  base_scene_path: "../GaussianConstruction/configs/data/habitat_val"
  clip_model_name: "ViT-B-32"
  # 离线或无外网：先在有网机器下载 openai ViT-B-32 权重为 .pt，再填本地绝对路径或相对 GaussianNavigation 根目录的路径
  # clip_pretrained_path: "weights/ViT-B-32-openai.pt"
  clip_dim: 512
  use_open_vocab_benchmark: False
  mapper:
    frame_height: 320
    frame_width: 240
    map_resolution: 5
    map_size_cm: 3600
    global_downscaling: 3
    enable_dynamic_semantic_update: False
    dynamic_semantic_blend_alpha: 0.3
