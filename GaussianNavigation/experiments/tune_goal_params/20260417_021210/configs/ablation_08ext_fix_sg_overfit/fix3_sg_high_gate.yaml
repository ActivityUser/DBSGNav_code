# Fix 3：不改融合策略，仅大幅提高 SG 采纳门槛（legacy 模式下抬高门控）。
# 相对 full.yaml：min_sim 0.3→0.92, high_conf 0.85→0.95, 开启 prefer_ov_low_conf。
# 预期：绝大多数 val episode SG 不满足门槛，回退 OV → 近似 wo_sg_fusion_g6 水平。
defaults:
- /habitat: habitat_config_base
- /habitat/task: instance_imagenav
- /habitat/simulator/agents@habitat.simulator.agents.main_agent: rgbd_agent
- /habitat/dataset/instance_imagenav: hm3d_v3
- _self_
habitat:
  environment:
    max_episode_seconds: 1000
  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 480
            height: 640
            hfov: 42
            position:
            - 0
            - 0.88
            - 0
          depth_sensor:
            width: 480
            height: 640
            hfov: 42
            min_depth: 0.01
            max_depth: 15.0
            position:
            - 0
            - 0.88
            - 0
        height: 0.88
        radius: 0.17
    habitat_sim_v0:
      gpu_device_id: 0
      allow_sliding: true
  dataset:
    split: val
    content_scenes:
    - '*'
end2end_imagenav:
  env_name: instance_imagenav
  dump_location: examples/
  max_episodes: 1000
  num_envs: 1
  num_gpus: 1
  num_nodes: 1
  split: val
  node_id: 0
  gpu_id: 0
  checkpoint_folder: data/new_checkpoints
  log_interval: 10
  num_checkpoints: 100
  force_torch_single_threaded: true
  viz_params:
    viz: false
    viz_failure_case: true
  particle_params:
    method: 1
    remap_goal: true
  use_semantic_gaussian_goal: true
  gaussian_map_root: ../GaussianConstruction/experiments/habitat_val_final
  semantic_gaussian_top_k: 1
  # --- Fix 3: 大幅提高 SG 门槛 ---
  semantic_gaussian_min_sim: 0.92
  semantic_gaussian_high_conf_sim: 0.95
  prefer_open_vocab_when_semantic_gaussian_low_conf: true
  # --- end fix ---
  semantic_gaussian_ov_disagree_dist: 10.0
  semantic_gaussian_ov_disagree_high_conf: 0.88
  semantic_gaussian_ov_disagree_force_dist: 0.0
  semantic_gaussian_max_agent_goal_dist: 13.0
  open_vocab_max_agent_goal_dist: 6.0
  open_vocab_agent_dist_penalty: 0.025
  fusion_adaptive_weights: false
  log_episode_goal_summary: true
  open_vocab_min_geometric_matches: 30
  semantic_gaussian_enable_fallback_open_vocab: true
  use_open_vocab_retrieval: true
  allow_gt_fallback: false
  non_gt_fallback_handling: count_as_failure
  open_vocab_top_k: 6
  open_vocab_semantic_weight: 0.8
  fusion_geometric_weight: 0.6
  open_vocab_fusion_use_semantic_score: true
  open_vocab_fusion_use_geometric_score: true
  fusion_normalize_geometric: minmax
  base_scene_path: ../GaussianConstruction/configs/data/habitat_val
  clip_model_name: ViT-B-32
  clip_dim: 512
  use_open_vocab_benchmark: false
  dynamic_semantic_update_max_goal_dist: 4.0
  dynamic_semantic_update_disable_when_ov_geo_floor_weak: true
  dynamic_semantic_planner_max_goal_dist: 3.0
  dynamic_semantic_planner_disable_when_ov_geo_floor_weak: true
  open_vocab_circuit_breaker_geo_floor: true
  open_vocab_circuit_breaker_long_tail: true
  mapper:
    dynamic_semantic_blend_alpha: 0.05
    dynamic_semantic_update_interval: 4
    dynamic_semantic_update_min_consistency: 0.45
    dynamic_semantic_adaptive_alpha: consistency
    dynamic_semantic_renormalize_cells: true
    dynamic_semantic_planner: true
    dynamic_semantic_planner_thr: 0.50
    dynamic_semantic_planner_radius: 6
    dynamic_semantic_planner_min_timestep: 30
    dynamic_semantic_planner_peaks_only: true
    dynamic_semantic_planner_max_peaks: 4
    dynamic_semantic_planner_peak_min_sep: 8
    enable_dynamic_semantic_update: true
    frame_height: 320
    frame_width: 240
    map_resolution: 5
    map_size_cm: 3600
    global_downscaling: 3
