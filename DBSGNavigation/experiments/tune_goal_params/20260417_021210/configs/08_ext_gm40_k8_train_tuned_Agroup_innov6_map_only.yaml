# 与 08_ext_gm40_k8_train_tuned_Agroup.yaml 完全一致，仅做创新点6「地图在线更新」消融：
# - 开 enable_dynamic_semantic_update + consistency 动态 alpha
# - 关 dynamic_semantic_planner（不把在线语义扩进 FMM），用于判断掉点来自「地图更新」还是「规划接入」
defaults:
- /habitat: habitat_config_base
- /habitat/task: instance_imagenav
- /habitat/simulator/agents@habitat.simulator.agents.main_agent: rgbd_agent
- /habitat/dataset/instance_imagenav: hm3d_v3
- _self_
habitat:
  environment:
    max_episode_seconds: 1000
  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 480
            height: 640
            hfov: 42
            position:
            - 0
            - 0.88
            - 0
          depth_sensor:
            width: 480
            height: 640
            hfov: 42
            min_depth: 0.01
            max_depth: 15.0
            position:
            - 0
            - 0.88
            - 0
        height: 0.88
        radius: 0.17
    habitat_sim_v0:
      gpu_device_id: 0
      allow_sliding: true
  dataset:
    split: train
    content_scenes:
    - '*'
end2end_imagenav:
  env_name: instance_imagenav
  dump_location: examples/
  max_episodes: 200
  num_envs: 1
  num_gpus: 1
  num_nodes: 1
  split: train
  node_id: 0
  gpu_id: 0
  train_scene_shuffle: false
  train_scene_interleave: false
  train_max_consecutive_scene_eps: 0
  train_report_rolling_window: 0
  checkpoint_folder: data/new_checkpoints
  log_interval: 10
  num_checkpoints: 100
  force_torch_single_threaded: true
  viz_params:
    viz: false
    viz_failure_case: true
  particle_params:
    method: 1
    remap_goal: true
  use_semantic_gaussian_goal: true
  gaussian_map_root: ../DBSGConstruction/experiments/habitat_train
  semantic_gaussian_top_k: 1
  semantic_gaussian_min_sim: 0.3
  semantic_gaussian_high_conf_sim: 0.85
  semantic_gaussian_ov_disagree_dist: 7.0
  semantic_gaussian_ov_disagree_high_conf: 0.997
  semantic_gaussian_ov_disagree_force_dist: 12.0
  semantic_gaussian_max_agent_goal_dist: 12.0
  open_vocab_max_agent_goal_dist: 6.0
  open_vocab_agent_dist_penalty: 0.025
  fusion_adaptive_weights: false
  log_episode_goal_summary: true
  open_vocab_min_geometric_matches: 20
  prefer_open_vocab_when_semantic_gaussian_low_conf: false
  semantic_gaussian_enable_fallback_open_vocab: true
  use_open_vocab_retrieval: true
  allow_gt_fallback: false
  non_gt_fallback_handling: count_as_failure
  open_vocab_top_k: 8
  open_vocab_semantic_weight: 0.8
  fusion_geometric_weight: 0.6
  fusion_normalize_geometric: minmax
  base_scene_path: ../DBSGConstruction/configs/data/habitat_train
  clip_model_name: ViT-B-32
  clip_dim: 512
  use_open_vocab_benchmark: false
  mapper:
    frame_height: 320
    frame_width: 240
    map_resolution: 5
    map_size_cm: 3600
    global_downscaling: 3
    enable_dynamic_semantic_update: true
    dynamic_semantic_blend_alpha: 0.3
    dynamic_semantic_adaptive_alpha: "consistency"
    dynamic_semantic_alpha_min: 0.05
    dynamic_semantic_alpha_decay: 0.5
    dynamic_semantic_planner: false
